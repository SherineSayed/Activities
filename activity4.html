<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Activity 4 - Fetch API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #eee;
      padding: 20px;
    }
    h1 { color: #f0a500; }
    pre {
      background: #2b2b2b;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Activity 4: Fetch Users</h1>
  <p>افتح الـ Console (F12) عشان تشوف الداتا مطبوعة، وكمان هنعرضها هنا في الصفحة.</p>
  <div id="output">Loading...</div>

  <script>
    fetch("https://jsonplaceholder.typicode.com/users")
      .then(response => response.json())
      .then(data => {
        console.log(data);

        // Display the data nicely on the page too
        const output = document.getElementById("output");
        output.innerHTML = "";

        data.forEach(user => {
          const card = document.createElement("div");
          card.style.border = "1px solid #444";
          card.style.borderRadius = "6px";
          card.style.padding = "10px";
          card.style.margin = "10px 0";
          card.innerHTML = `
            <strong>${user.name}</strong><br/>
            Email: ${user.email}<br/>
            City: ${user.address.city}
          `;
          output.appendChild(card);
        });
      })
      .catch(error => {
        console.error("Error fetching data:", error);
        document.getElementById("output").innerText = "Error loading data.";
      });
  </script>
</body>
</html>
